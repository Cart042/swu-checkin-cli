name: SWU Check-in

on:
  schedule:
    # 每天北京时间 21:05 触发一次。GitHub cron 使用 UTC 时间。
    #
    # 定时触发只在仓库变量 SWU_CHECKIN_ENABLED 为 true 时才真正打卡，默认不开：
    # 这样"每天自动打卡"必须由人显式开启，也不会因为 GitHub 在仓库长期不活跃后
    # 自动停用定时工作流而悄悄失效（开关状态记录在仓库里，随时能查）。
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "失败时保存脱敏登录诊断文本"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swu-check-in
  cancel-in-progress: false

jobs:
  check-in:
    # 定时触发需要显式开启 SWU_CHECKIN_ENABLED；未开启（变量不存在或不是 "true"）
    # 时本次运行直接跳过，不登录、不使用任何凭据、也不提交打卡。
    # 手动触发不受开关限制，方便临时补打卡。
    #
    # 开启每日自动打卡：gh variable set SWU_CHECKIN_ENABLED --body true
    # 关闭每日自动打卡：gh variable delete SWU_CHECKIN_ENABLED
    if: github.event_name == 'workflow_dispatch' || vars.SWU_CHECKIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      SWU_USERNAME: ${{ secrets.SWU_USERNAME }}
      SWU_PASSWORD: ${{ secrets.SWU_PASSWORD }}
      PUSH_DINGTALK_TOKEN: ${{ secrets.PUSH_DINGTALK_TOKEN }}
      PUSH_DINGTALK_SECRET: ${{ secrets.PUSH_DINGTALK_SECRET }}
      PUSH_QYWX_KEY: ${{ secrets.PUSH_QYWX_KEY }}
      PUSH_BARK_KEY: ${{ secrets.PUSH_BARK_KEY }}
      PUSH_BARK_URL: ${{ secrets.PUSH_BARK_URL }}
      PUSH_SERVERCHAN_KEY: ${{ secrets.PUSH_SERVERCHAN_KEY }}
      PUSH_PUSHDEER_KEY: ${{ secrets.PUSH_PUSHDEER_KEY }}
      PUSH_TELEGRAM_BOT_TOKEN: ${{ secrets.PUSH_TELEGRAM_BOT_TOKEN }}
      PUSH_TELEGRAM_CHAT_ID: ${{ secrets.PUSH_TELEGRAM_CHAT_ID }}
      SWU_LOG_LEVEL: INFO
      SWU_RUN_DEADLINE_SECONDS: "900"
      SWU_DEBUG_DIR: ${{ inputs.debug == true && 'debug' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 记下本次运行是手动触发还是开关已开启，方便回头审计。
      - name: Report how this run was started
        run: |
          echo "触发方式: ${{ github.event_name }}"
          echo "SWU_CHECKIN_ENABLED: ${{ vars.SWU_CHECKIN_ENABLED }}"

      - name: Prepare debug directory
        if: ${{ inputs.debug == true }}
        run: mkdir -p debug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Chromium headless shell for browser login
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Check local configuration
        run: python check_in.py --check-config

      - name: Run check-in
        run: python -u check_in.py

      - name: List debug files
        if: ${{ always() && inputs.debug == true }}
        run: find debug -maxdepth 2 -type f -print || true

      - name: Upload login debug artifacts
        if: ${{ always() && inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
