name: SWU Check-in

on:
  schedule:
    # GitHub cron 使用 UTC；13:05 UTC = 北京时间 21:05。
    # 定时执行需要仓库变量 SWU_SCHEDULE_ENABLED=true；官方仓库生产定时由 VPS systemd 负责。
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "失败时保存脱敏登录诊断文本"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swu-check-in
  cancel-in-progress: false

jobs:
  check-in:
    # 手动触发始终允许；schedule 只有显式设置 SWU_SCHEDULE_ENABLED=true 才执行。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SWU_SCHEDULE_ENABLED == 'true' }}
    # 官方仓库使用专用的 self-hosted runner；fork 自动回退到 GitHub-hosted runner。
    runs-on: ${{ github.repository == 'Cart042/swu-checkin-cli' && 'swu-checkin' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      # 推荐使用 SWU_USERS 配置一个或多个账号；若未设置，则继续兼容旧的单账号 Secrets。
      SWU_USERS: ${{ secrets.SWU_USERS }}
      SWU_USERNAME: ${{ secrets.SWU_USERNAME }}
      SWU_PASSWORD: ${{ secrets.SWU_PASSWORD }}
      PUSH_DINGTALK_TOKEN: ${{ secrets.PUSH_DINGTALK_TOKEN }}
      PUSH_DINGTALK_SECRET: ${{ secrets.PUSH_DINGTALK_SECRET }}
      PUSH_QYWX_KEY: ${{ secrets.PUSH_QYWX_KEY }}
      PUSH_BARK_KEY: ${{ secrets.PUSH_BARK_KEY }}
      PUSH_BARK_URL: ${{ secrets.PUSH_BARK_URL }}
      PUSH_SERVERCHAN_KEY: ${{ secrets.PUSH_SERVERCHAN_KEY }}
      PUSH_PUSHDEER_KEY: ${{ secrets.PUSH_PUSHDEER_KEY }}
      PUSH_TELEGRAM_BOT_TOKEN: ${{ secrets.PUSH_TELEGRAM_BOT_TOKEN }}
      PUSH_TELEGRAM_CHAT_ID: ${{ secrets.PUSH_TELEGRAM_CHAT_ID }}
      SWU_LOG_LEVEL: INFO
      SWU_RUN_DEADLINE_SECONDS: "900"
      SWU_DEBUG_DIR: ${{ inputs.debug == true && 'debug' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare debug directory
        if: ${{ inputs.debug == true }}
        run: mkdir -p debug

      - name: Verify Python 3.11 on self-hosted runner
        if: ${{ github.repository == 'Cart042/swu-checkin-cli' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3.11 >/dev/null 2>&1; then
            echo "python3.11 is required on the self-hosted runner."
            exit 1
          fi
          python3.11 --version

      - name: Set up Python on GitHub-hosted runner
        if: ${{ github.repository != 'Cart042/swu-checkin-cli' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare persistent runtime on self-hosted runner
        if: ${{ github.repository == 'Cart042/swu-checkin-cli' }}
        shell: bash
        run: |
          set -euo pipefail

          runtime_dir="${HOME}/.cache/swu-checkin-actions"
          venv_dir="${runtime_dir}/venv"
          marker="${runtime_dir}/runtime.sha256"
          mkdir -p "${runtime_dir}"

          fingerprint="$({
            python3.11 -c 'import sys; print(sys.version)'
            sha256sum requirements.txt
          } | sha256sum | awk '{print $1}')"

          if [[ ! -x "${venv_dir}/bin/python" ]] \
            || [[ ! -f "${marker}" ]] \
            || [[ "$(cat "${marker}" 2>/dev/null || true)" != "${fingerprint}" ]]; then
            echo "Runtime changed; rebuilding persistent virtual environment."
            rm -rf "${venv_dir}"
            python3.11 -m venv "${venv_dir}"
            "${venv_dir}/bin/python" -m pip install \
              --disable-pip-version-check \
              -r requirements.txt
            printf '%s\n' "${fingerprint}" > "${marker}"
          else
            echo "Reusing persistent virtual environment."
          fi

          echo "${venv_dir}/bin" >> "${GITHUB_PATH}"

      - name: Install dependencies on GitHub-hosted runner
        if: ${{ github.repository != 'Cart042/swu-checkin-cli' }}
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ensure Chromium headless shell on self-hosted runner
        if: ${{ github.repository == 'Cart042/swu-checkin-cli' }}
        run: python -m playwright install --only-shell chromium

      - name: Install Chromium headless shell on GitHub-hosted runner
        if: ${{ github.repository != 'Cart042/swu-checkin-cli' }}
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Check local configuration
        run: python check_in.py --check-config

      - name: Run check-in
        run: python -u check_in.py

      - name: List debug files
        if: ${{ always() && inputs.debug == true }}
        run: find debug -maxdepth 2 -type f -print || true

      - name: Upload login debug artifacts
        if: ${{ always() && inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
