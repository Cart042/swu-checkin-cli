name: SWU Check-in

on:
  schedule:
    # 每天北京时间 21:05 自动运行。GitHub cron 使用 UTC 时间。
    #
    # 定时是否会触发由工作流自身的启用状态决定（Actions 页面 Enable/Disable
    # workflow，或 gh workflow enable/disable）。状态保存在 GitHub 上而不是仓库
    # 里，GitHub 会在仓库长期不活跃后自动停用，README 里有排查说明。
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "失败时保存脱敏登录诊断文本"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swu-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      SWU_USERNAME: ${{ secrets.SWU_USERNAME }}
      SWU_PASSWORD: ${{ secrets.SWU_PASSWORD }}
      PUSH_DINGTALK_TOKEN: ${{ secrets.PUSH_DINGTALK_TOKEN }}
      PUSH_DINGTALK_SECRET: ${{ secrets.PUSH_DINGTALK_SECRET }}
      PUSH_QYWX_KEY: ${{ secrets.PUSH_QYWX_KEY }}
      PUSH_BARK_KEY: ${{ secrets.PUSH_BARK_KEY }}
      PUSH_BARK_URL: ${{ secrets.PUSH_BARK_URL }}
      PUSH_SERVERCHAN_KEY: ${{ secrets.PUSH_SERVERCHAN_KEY }}
      PUSH_PUSHDEER_KEY: ${{ secrets.PUSH_PUSHDEER_KEY }}
      PUSH_TELEGRAM_BOT_TOKEN: ${{ secrets.PUSH_TELEGRAM_BOT_TOKEN }}
      PUSH_TELEGRAM_CHAT_ID: ${{ secrets.PUSH_TELEGRAM_CHAT_ID }}
      SWU_LOG_LEVEL: INFO
      SWU_RUN_DEADLINE_SECONDS: "900"
      SWU_DEBUG_DIR: ${{ inputs.debug == true && 'debug' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare debug directory
        if: ${{ inputs.debug == true }}
        run: mkdir -p debug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Chromium headless shell for browser login
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Check local configuration
        run: python check_in.py --check-config

      - name: Run check-in
        run: python -u check_in.py

      - name: List debug files
        if: ${{ always() && inputs.debug == true }}
        run: find debug -maxdepth 2 -type f -print || true

      - name: Upload login debug artifacts
        if: ${{ always() && inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
