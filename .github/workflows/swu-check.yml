name: SWU Check-in

on:
  schedule:
    # 每天北京时间 21:05 自动运行。GitHub cron 使用 UTC 时间。
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "失败时保存脱敏登录诊断文本"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swu-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      SWU_USERNAME: ${{ secrets.SWU_USERNAME }}
      SWU_PASSWORD: ${{ secrets.SWU_PASSWORD }}
      SWU_LOG_LEVEL: INFO
      SWU_RUN_DEADLINE_SECONDS: "900"
      SWU_DEBUG_DIR: ${{ inputs.debug == true && 'debug' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare debug directory
        if: ${{ inputs.debug == true }}
        run: mkdir -p debug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for browser login
        run: playwright install chromium

      - name: Check configuration
        run: python check_in.py --check-config

      - name: Run check-in
        run: python -u check_in.py

      - name: List debug files
        if: ${{ always() && inputs.debug == true }}
        run: find debug -maxdepth 2 -type f -print || true

      - name: Upload login debug artifacts
        if: ${{ always() && inputs.debug == true }}
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
