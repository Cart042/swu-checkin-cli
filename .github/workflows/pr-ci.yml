name: Runtime PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Chromium headless shell
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run local runtime smoke test
        run: python scripts/smoke_runtime.py

      - name: Check command-line entry point
        run: python check_in.py --help
