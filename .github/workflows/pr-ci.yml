name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 公开仓库的 PR 只在 GitHub 托管的 runner 上执行。
# 不要把 pull_request 事件接到自建/自托管 runner：任何 fork 都能改动检出代码，
# 签到凭据和部署主机的访问权限必须与 PR 构建隔离。

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.14.4"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install mypy
        run: |
          python -m pip install --disable-pip-version-check "mypy==1.18.2" "types-requests>=2.32.0"

      - name: Type check
        run: mypy

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # README 声明支持 3.11+，这里至少覆盖 3.11 和 3.12。
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install offline test dependencies
        # 只装离线单元测试真正导入的依赖，不安装 Chromium 和 ddddocr；
        # 版本与 pyproject.toml 的 test 附加依赖保持一致。
        run: |
          python -m pip install --disable-pip-version-check \
            "requests==2.34.2" "python-dotenv==1.2.3"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check command-line entry point
        run: python check_in.py --help

  runtime-checks:
    name: Runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Chromium headless shell
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Run local runtime smoke test
        run: python scripts/smoke_runtime.py

  # 分支保护只需要锁住这一个检查名：job 名称变化时不会让 main 的必需检查失效。
  required:
    name: CI required checks
    needs: [lint, type-check, unit-tests, runtime-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "以下必需检查未通过：${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: Report success
        run: echo "全部必需检查通过：${{ join(needs.*.result, ', ') }}"
