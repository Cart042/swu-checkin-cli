# 依赖更新：Python 依赖（requirements.txt 与 pyproject.toml）、
# GitHub Actions 与 Docker 基础镜像各自按周检查。
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: deps
      include: scope
    groups:
      # 检查工具一起升级，避免 ruff / mypy 各自开一个 PR。
      check-tools:
        patterns: ["ruff", "mypy", "types-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: docker
