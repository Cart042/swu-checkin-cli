# 依赖更新：Python 依赖（requirements.txt 与 pyproject.toml）、
# GitHub Actions 与 Docker 基础镜像各自按周检查。
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: deps
      include: scope
    groups:
      # 检查工具一起升级，避免 ruff / mypy 各自开一个 PR。
      check-tools:
        patterns: ["ruff", "mypy", "types-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: docker
    ignore:
      # 基础镜像的 Python 版本要和 CI 矩阵（3.11/3.12）、requires-python 以及
      # ddddocr / onnxruntime 的 wheel 覆盖范围一起决定，不能让 Dependabot 自动
      # 跳到 3.14：PR CI 不构建镜像，跳版本的风险不会被任何检查拦住。
      # 升级基础镜像时手动改 Dockerfile 即可。
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
